spring:
  application:
    name: civic-air-quality-briefing-studio
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civic_air}
    username: ${DATABASE_USERNAME:civic_air}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: ${AI_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:}
security:
  jwt:
    secret: ${JWT_SECRET:}
civic:
  ai:
    enabled: ${CIVIC_AI_ENABLED:false}
  local-admin:
    enabled: ${CIVIC_LOCAL_ADMIN_ENABLED:false}
    email: ${CIVIC_LOCAL_ADMIN_EMAIL:}
    password: ${CIVIC_LOCAL_ADMIN_PASSWORD:}
app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true
