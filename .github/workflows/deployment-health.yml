name: Deployment health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

jobs:
  health:
    name: Check configured deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require deployment URLs
        env:
          BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL }}
          FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "Set repository variable RAILWAY_BACKEND_URL."; exit 1; }
          test -n "$FRONTEND_URL" || { echo "Set repository variable RAILWAY_FRONTEND_URL."; exit 1; }

      - name: Check backend health and database connectivity
        env:
          BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BACKEND_URL/actuator/health"

      - name: Check frontend health
        env:
          FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$FRONTEND_URL/"

      - name: Check frontend-to-backend API proxy
        env:
          FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$FRONTEND_URL/actuator/health"
